name: Price parser

# Щоденний обхід сайтів будматеріалів → ціни в CRM (Постачальники → Ринкові ціни).
on:
  schedule:
    - cron: "20 3 * * *" # 06:20 за Києвом улітку, 05:20 узимку
  workflow_dispatch:
    inputs:
      site:
        description: "Лише ці магазини (через кому): epicentr, oldi, budia, kub, budmaterial, m2. Порожньо — усі"
        required: false

concurrency:
  group: price-parser
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://uaufrrpfvixhprqhqjzo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      PRICE_PARSER_TOKEN: ${{ secrets.PRICE_PARSER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run parser
        env:
          SITE: ${{ inputs.site }}
        run: node tools/price-parser/run.mjs ${SITE:+--site=$SITE}
